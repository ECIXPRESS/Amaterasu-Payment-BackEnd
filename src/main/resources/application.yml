server:
  port: 8085

spring:
  application:
    name: payment-service
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

# Configuración COMPLETA de Swagger/OpenAPI
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
    doc-expansion: none
    display-request-duration: true
    filter: true
  show-actuator: false
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  cache:
    disabled: true
  info:
    title: Payment Service API
    version: 1.0.0
    description: API para gestión de pagos en ECIEXPRESS

# Configuración de Microservicios Externos

gateway:
  url: http://gateway:8081/api


microservices:
  receipt:
    base-path: /v1/receipts

  promotion:
    base-path: /v1/promotions

  wallet:
    base-path: /v1/wallet

  bank-gateway:
    payu:
      base-url: https://sandbox.api.payulatam.com/payments-api/4.0/service.cgi
      api-login: pRRXKOl8ikMmt9u
      api-key: 4Vj8eK4rloUd272L48hsrarnUA
      merchant-id: 508029
      account-id: 512321
      currency: COP
      test-mode: true
      timeout: 30000

# Configuración de Resilience4j para Circuit Breaker
resilience4j:
  circuitbreaker:
    instances:
      receiptService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000
        permitted-number-of-calls-in-half-open-state: 3
      promotionService:
        sliding-window-size: 10
        failure-rate-threshold: 60
        wait-duration-in-open-state: 15000
      walletService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000
  retry:
    instances:
      receiptService:
        max-attempts: 3
        wait-duration: 2s
      promotionService:
        max-attempts: 2
        wait-duration: 1s

logging:
  level:
    com.tucompany.users: DEBUG
    org.springframework.data.mongodb: INFO
    ECIEXPRESS.AmaterasuPagos.Payment.BackEnd.Infrastructure.Clients: DEBUG
    org.springdoc: DEBUG